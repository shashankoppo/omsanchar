name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-and-protocol:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check Rust formatting, lints, and stream conformance
        run: |
          cargo fmt --manifest-path dataplane/sanchar-core/Cargo.toml -- --check
          cargo clippy --locked --manifest-path dataplane/sanchar-core/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path dataplane/sanchar-core/Cargo.toml
          cargo test --locked --manifest-path dataplane/sanchar-core/Cargo.toml --features token-bench --bin capability_token_bench
          cargo build --locked --manifest-path dataplane/sanchar-core/Cargo.toml --bin mock_model
          python3 scripts/test_mock_model.py dataplane/sanchar-core/target/debug/mock_model

      - name: Run dependency-free reference tests
        run: |
          python3 -m unittest discover -s spec/tests -v
          python3 -m unittest discover -s sim/tests -v
          python3 -m unittest discover -s gateway/tests -v
          python3 -m unittest discover -s spikes/capability-token/tests -v

      - name: Check text formatting
        run: python3 scripts/check_style.py

      - name: Check exact dependency pins and license inventory
        run: python3 scripts/check_dependencies.py

      - name: Check locked Rust dependency versions, sources, and licenses
        run: python3 scripts/check_dependencies.py --check-rust

      - name: Install pinned Python lint tooling
        run: python3 -m pip install --disable-pip-version-check --no-deps --target "${RUNNER_TEMP}/om-sanchar-ci-python" -r requirements-dev.txt

      - name: Check installed dependency versions and licenses
        env:
          PYTHONPATH: ${{ runner.temp }}/om-sanchar-ci-python
        run: python3 scripts/check_dependencies.py --check-installed

      - name: Run Python lint and format checks
        env:
          PYTHONPATH: ${{ runner.temp }}/om-sanchar-ci-python
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: Generate source SBOM
        run: python3 scripts/generate_source_sbom.py --output artifacts/source-sbom.spdx.json

      - name: Generate dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/dependency-sbom.spdx.json
          artifact-name: dependency-sbom

      - name: Scan dependency SBOM for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: artifacts/dependency-sbom.spdx.json
          severity-cutoff: high
          output-format: table

      - name: Set up Buf CLI
        uses: bufbuild/buf-action@v1.5.0
        with:
          version: 1.73.0
          setup_only: true
          push: false

      - name: Validate protobuf schema
        run: |
          buf format --diff --exit-code spec
          buf lint spec
          buf build spec

      - name: Check protobuf compatibility against v0.1.0
        run: buf breaking spec --against ".git#tag=v0.1.0,subdir=spec"

      - name: Build reference verification container
        run: docker build -f deploy/Dockerfile.verify -t om-sanchar-verify:ci .

      - name: Build native development stack with Compose
        run: docker compose -f deploy/dev.yml build
