[package]
name = "sanchar-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Executable stream protocol core for Om Sanchar"

[dependencies]
bytes = "=1.11.1"
biscuit-auth = { version = "=6.0.0", optional = true }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"], optional = true }
futures-util = "=0.3.31"
hmac = { version = "=0.12.1", optional = true }
http-body-util = "=0.1.2"
hyper = { version = "=1.5.2", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.10", default-features = false, features = ["http1", "server", "tokio"] }
rand = { version = "=0.8.8", optional = true }
serde_json = "=1.0.140"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
sha2 = { version = "=0.10.8", optional = true }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "net", "rt-multi-thread"] }

[features]
token-bench = ["dep:biscuit-auth", "dep:ed25519-dalek", "dep:hmac", "dep:rand", "dep:serde", "dep:sha2"]

[[bin]]
name = "capability_token_bench"
path = "src/bin/capability_token_bench.rs"
required-features = ["token-bench"]

[dev-dependencies]
